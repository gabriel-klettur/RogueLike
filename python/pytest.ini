[pytest]
minversion = 6.0
addopts = --maxfail=1 --import-mode=importlib
testpaths = tests
pythonpath = src
python_files = test_*.py
markers =
    slow: marks tests as slow; deselect with '-m "not slow"'
    timeout: marks tests that use the external pytest-timeout plugin or emulate a timeout decorator
filterwarnings =
    ignore:pkg_resources is deprecated as an API.*:UserWarning:pygame\.pkgdata
    ignore:pkg_resources is deprecated as an API.*
    ignore:jsonschema\.RefResolver is deprecated.*:DeprecationWarning:roguelike_game\.ecs\.systems\.inventory\.map_load_drops_system
    ignore:Unknown pytest\.mark\.timeout.*
