# Ruff configuration for RogueLike project
line-length = 120
extend-exclude = [".venv", "venv", "env", "build", "dist", ".git", ".mypy_cache", ".pytest_cache"]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort (import sorting)
  "BLE", # flake8-blind-except (no bare 'except:')
  "T20", # flake8-print (T201/T203)
]
ignore = [
  # Allow unused imports in __init__.py files that expose public API
  "F401",
]

[lint.per-file-ignores]
"tests/**/*.py" = ["T201"] # allow print in tests if needed

[format]
quote-style = "preserve"
indent-style = "space"
line-ending = "auto"
